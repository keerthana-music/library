<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keerthana Repertoire Library</title>
<style>
:root{--maroon:#7a1f2b;--saffron:#d98324;--cream:#fbf6ec;--ink:#2a221c;--muted:#8a7d70;--line:#e7ddcc;--chip:#f3e9d6;--ok:#2e7d5b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--maroon),#5c1620);color:#fff;padding:18px 20px 14px}
header h1{margin:0;font-size:20px;font-weight:700}header .sub{opacity:.85;font-size:12.5px;margin-top:3px}
.tabs{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.13);color:#fff;padding:8px 14px;border-radius:999px;font-size:13.5px;cursor:pointer}
.tabs button.active{background:var(--saffron);font-weight:600}
.tabs .badge{background:rgba(255,255,255,.28);border-radius:999px;padding:0 6px;margin-left:6px;font-size:11px}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.controls input,.controls select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink)}
.controls input#q{flex:1 1 220px;min-width:150px}
.count{font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px}
.card .main{flex:1;min-width:0}.piece{font-size:16px;font-weight:650;line-height:1.25}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:#6b5330;white-space:nowrap}
.chip.raga{background:#eddfce;color:var(--maroon);font-weight:600}.chip.type{background:#e6efe9;color:var(--ok)}
.composer{font-size:12.5px;color:var(--muted);margin-top:5px}
.scale{font-size:11px;color:#a08b6f;margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:34px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.iconbtn.on{background:var(--saffron);border-color:var(--saffron);color:#fff}.iconbtn.add{color:var(--maroon)}.iconbtn.dis{opacity:.35}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.citem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.cnum{width:26px;height:26px;border-radius:50%;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto}
.cinfo{flex:1;min-width:0}.cinfo .p{font-weight:600;font-size:14.5px}.cinfo .m{font-size:12px;color:var(--muted);margin-top:2px}
.cinfo input{border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;width:64px;margin-top:5px}
.move button,.crm{border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;width:30px;height:22px;padding:0}
.move{display:flex;flex-direction:column;gap:3px}.crm{height:47px;width:34px;color:#b23;font-size:16px}
.barbtn{border:0;border-radius:10px;padding:10px 15px;font-size:14px;cursor:pointer;font-weight:600}
.barbtn.primary{background:var(--maroon);color:#fff}.barbtn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.cbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.note{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}
#ptable{display:none;width:100%;border-collapse:collapse;font-size:13px}#ptable th,#ptable td{border:1px solid #ccc;padding:6px 8px;text-align:left}
@media print{header,.tabs,.controls,.count,.acts,#view-browse,#view-library,.cbar,.note,.move,.crm,.cinfo input,#conList{display:none!important}
 .wrap{max-width:100%}#printhead,#ptable{display:block!important}#ptable{display:table!important}}
#printhead{display:none;text-align:center;margin-bottom:12px}
</style></head><body>
<header><h1>Keerthana Repertoire Library</h1>
<div class="sub">Search the class song bank · open the notation · build & print your concert order</div>
<div class="tabs">
<button data-tab="browse" class="active">Browse</button>
<button data-tab="library">My Library <span class="badge" id="libBadge">0</span></button>
<button data-tab="concert">Concert <span class="badge" id="conBadge">0</span></button>
</div></header>
<div class="wrap">
<div id="printhead"><div style="font-size:20px;font-weight:700;color:#7a1f2b">Concert Running Order</div><div style="font-size:12px;color:#888" id="printdate"></div></div>
<table id="ptable"><thead><tr><th>#</th><th>Piece</th><th>Ragam</th><th>Talam</th><th>Composer</th><th>Shruthi</th></tr></thead><tbody id="pbody"></tbody></table>
<div id="view-browse">
 <div class="controls">
  <input id="q" placeholder="Search piece, raga, composer…">
  <select id="fRaga"><option value="">All ragas</option></select>
  <select id="fType"><option value="">All types</option></select>
  <select id="fComposer"><option value="">All composers</option></select>
 </div>
 <div class="count" id="count"></div>
 <div id="list"></div>
</div>
<div id="view-library" style="display:none">
 <div class="note">★ Songs you star stay on <b>this device</b>. Star from Browse to add.</div>
 <div id="libList"></div>
</div>
<div id="view-concert" style="display:none">
 <div class="cbar"><button class="barbtn primary" onclick="window.print()">🖨 Print running order</button><button class="barbtn ghost" id="clearCon">Clear</button></div>
 <div id="conList"></div>
</div></div>

const key=r=>r.Piece;
const save=()=>{localStorage.setItem(LS.star,JSON.stringify([...star]));localStorage.setItem(LS.con,JSON.stringify(con));localStorage.setItem(LS.sh,JSON.stringify(sh));};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(r){const st=star.has(key(r)),inc=con.includes(key(r));
 const link=r.Link?`<a class="iconbtn" href="${esc(r.Link)}" target="_blank" rel="noopener" title="Open notation">📄</a>`:`<span class="iconbtn dis" title="No notation file linked yet">📄</span>`;
 const scale=(r.Aro||r.Av)?`<div class="scale">▲ ${esc(r.Aro)}　▼ ${esc(r.Av)}</div>`:'';
 return `<div class="card"><div class="main">
  <div class="piece">${esc(r.Piece)}</div>
  <div class="meta">${r.Raga?`<span class="chip raga">${esc(r.Raga)}</span>`:''}${r.Tala?`<span class="chip">${esc(r.Tala)}</span>`:''}${r.Type?`<span class="chip type">${esc(r.Type)}</span>`:''}</div>
  ${r.Composer?`<div class="composer">${esc(r.Composer)}${r.Parent&&r.Parent!==r.Raga?' · mela: '+esc(r.Parent):''}</div>`:''}
  ${scale}</div>
  <div class="acts">
   <button class="iconbtn ${st?'on':''}" title="Star" onclick="tStar('${esc(key(r))}')">${st?'★':'☆'}</button>
   <button class="iconbtn add" title="${inc?'In concert':'Add to concert'}" onclick="aCon('${esc(key(r))}')">${inc?'✓':'＋'}</button>
   ${link}</div></div>`;}
function rBrowse(){const q=document.getElementById('q').value.trim().toLowerCase();
 const fr=fRaga.value,ft=fType.value,fc=fComposer.value;
 const out=CAT.filter(r=>{if(fr&&r.Raga!==fr)return 0;if(ft&&r.Type!==ft)return 0;if(fc&&r.Composer!==fc)return 0;
  if(q)return (r.Piece+' '+r.Raga+' '+r.Composer+' '+r.Type).toLowerCase().includes(q);return 1;});
 count.textContent=`${out.length} of ${CAT.length} songs`;
 list.innerHTML=out.length?out.map(card).join(''):'<div class="empty">No matches.</div>';}
function rLib(){const out=CAT.filter(r=>star.has(key(r)));libList.innerHTML=out.length?out.map(card).join(''):'<div class="empty">No starred songs yet.</div>';}
function rCon(){if(!con.length){conList.innerHTML='<div class="empty">Concert is empty. Add songs with ＋ from Browse.</div>';pbody.innerHTML='';return;}
 conList.innerHTML=con.map((k,i)=>{const r=CAT.find(x=>key(x)===k)||{Piece:k};
  return `<div class="citem"><div class="cnum">${i+1}</div><div class="cinfo">
   <div class="p">${esc(r.Piece)}</div><div class="m">${[r.Raga,r.Tala,r.Type,r.Composer].filter(Boolean).map(esc).join(' · ')}</div>
   <label style="font-size:11px;color:#8a7d70">Shruthi <input value="${esc(sh[k]||'')}" onchange="setSh('${esc(k)}',this.value)" placeholder="e.g. G#"></label></div>
   <div class="move"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button></div>
   <button class="crm" onclick="rm(${i})">×</button></div>`;}).join('');
 pbody.innerHTML=con.map((k,i)=>{const r=CAT.find(x=>key(x)===k)||{Piece:k};
  return `<tr><td>${i+1}</td><td>${esc(r.Piece)}</td><td>${esc(r.Raga||'')}</td><td>${esc(r.Tala||'')}</td><td>${esc(r.Composer||'')}</td><td>${esc(sh[k]||'')}</td></tr>`;}).join('');}
function badges(){libBadge.textContent=star.size;conBadge.textContent=con.length;}
function tStar(k){star.has(k)?star.delete(k):star.add(k);save();badges();rBrowse();rLib();}
function aCon(k){if(!con.includes(k))con.push(k);save();badges();rBrowse();rCon();}
function rm(i){con.splice(i,1);save();badges();rCon();rBrowse();}
function mv(i,d){const j=i+d;if(j<0||j>=con.length)return;[con[i],con[j]]=[con[j],con[i]];save();rCon();}
function setSh(k,v){sh[k]=v;save();}
